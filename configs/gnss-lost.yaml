# gnss-lost.yaml
#
# "GPS kayip" senaryosu: anten kopmus/sinyal yok gibi dusun.
# Uydu sayilari sifir, senkronizasyon kilitli degil.
# Bu senaryoyla baslatilan bir simulator uzerinde, izleme
# yazilimini "GPS sinyali giderse dogru alarm veriyor mu"
# diye test edebilirsin.

device:
  serial_number: "122301668"
  firmware_version: "1.17"

gps:
  visible: 0
  tracking: 0

sync:
  locked: false
  holdover: false

measure:
  # PCB sicakligi. GERCEK cihaz kayitlarinda kararli durumda
  # ~52.8 C (gozlenen aralik 46.57-52.87; dusuk okumalar isinma
  # sirasinda alinmis). CSAC sicakligi buradan turetilir (+1.32 C).
  temperature: 52.8
  voltage: 1.66
  current: 0.42
  power_supply: 11.7