# hardware-error.yaml
#
# "Donanim arizasi" senaryosu: cihazda gercek bir ARIZA var.
# SYST:STAT? artik "FAULT" doner. Ayrica bunun bir arizanin
# belirtisi olarak anormal olcum degerleri (yuksek sicaklik, dusuk
# GUC KAYNAGI voltaji, yuksek "akim") verdik -- gercekci bir ariza
# teshis modeli degil, ama "bir seyler kotu gidiyor" izlenimini
# test etmek icin makul bir varsayim.
#
# NOT: "voltage" (TCXO) alanini NORMAL birakiyoruz -- gercek cihaz
# ciktisina gore TCXO ayari ile guc kaynagi ayri seyler, ariza
# senaryosunda anormalligi GUC KAYNAGINDA (power_supply) gosteriyoruz.

device:
  serial_number: SIM000001
  firmware_version: "1.17"

gps:
  visible: 12
  tracking: 8

sync:
  locked: false
  holdover: false

diag:
  lifetime_hours: 871
  fault: true
  fault_message: "OSCILLATOR FAILURE"

measure:
  temperature: 95.0
  voltage: 1.66
  current: 1.2
  power_supply: 9.5