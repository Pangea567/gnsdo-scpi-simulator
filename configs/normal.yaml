# normal.yaml
#
# "Normal" senaryo: her sey saglikli. GPS kilitli, uydu sayilari
# iyi, olcumler normal aralikta. Bu, DeviceState'in zaten varsayilan
# (default) degerleriyle hemen hemen ayni -- ama artik BURADAN
# geliyor, koda gomulu degil.
#
# Bir alani bu dosyada YAZMAZSAN, DeviceState'teki Python varsayilani
# kullanilir (bkz. config_loader.py aciklamasi).

device:
  serial_number: "122301668"
  firmware_version: "1.17"

gps:
  visible: 12
  tracking: 8

sync:
  locked: true
  holdover: false

measure:
  temperature: 42.5
  voltage: 1.66
  current: 0.42
  power_supply: 11.7
# --- OLCUM GURULTUSU ---
# (model ve gerekceler: models/noise.py, docs/tasarim-kararlari.md)
#
# Gercek cihazda MEAS:TEMP? her sorguda tipatip ayni sayiyi dondurmez;
# sensor okumasi son hanede surekli oynar. Gurultu bu yuzden
# VARSAYILAN OLARAK ACIKTIR.
#
# Gurultu ZAMANIN fonksiyonudur, rastgele sayi akisi degil. Boylece:
#   - ayni anda iki sorgu AYNI cevabi verir (fiziksel olarak dogru)
#   - ayni calistirma AYNI degerleri uretir (hata ayiklanabilir)
#
# enabled: false yaparak ya da scale: 0.0 vererek tamamen kapatilir --
# gercek cihazla birebir cikti karsilastirmasi yaparken kullanislidir.
# scale: 0.5 gibi ara degerler genligi olceklendirir.
noise:
  enabled: true
  scale: 1.0
