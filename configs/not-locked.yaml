# not-locked.yaml
#
# "Kilitlenememis" senaryosu: cihaz saglikli (donanim arizasi YOK),
# GPS sinyali de iyi -- ama osilator su an referansa KILITLI DEGIL.
# Bu, "warming-up"tan farklidir: orada gecici bir isinma suresi var
# ve cihaz 2 dakika sonra kendiliginden kilitlenir. Burada ise
# warmup sayaci YOK (warmup_started_at None kalir), yani bu KALICI
# bir "kilitlenememe" durumu -- izleme yazilimini "cihaz uzun sure
# kilitlenemezse dogru alarm veriyor mu" diye test etmek icin.
#
# hardware-error senaryosundan farki: burada fault YOK, olcumler
# normal araligda. Tek anormallik: sync kilitli degil.

device:
  serial_number: "122301668"
  firmware_version: "1.17"

gps:
  visible: 12
  tracking: 8

sync:
  locked: false
  holdover: false

# Lifetime SIFIR DEGIL -- bu, senaryoyu "warming-up"tan (lifetime: 0)
# ayirt eden isaret: cihaz yeni acilmis degil, bir suredir calisiyor
# ama yine de kilitlenemiyor.
diag:
  lifetime_hours: 871

measure:
  # PCB sicakligi. GERCEK cihaz kayitlarinda kararli durumda
  # ~52.8 C (gozlenen aralik 46.57-52.87; dusuk okumalar isinma
  # sirasinda alinmis). CSAC sicakligi buradan turetilir (+1.32 C).
  temperature: 52.8
  voltage: 1.66
  current: 0.42
  power_supply: 11.7
