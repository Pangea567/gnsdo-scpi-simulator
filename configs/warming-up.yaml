# warming-up.yaml
#
# "Isiniyor" senaryosu: cihaz YENI ACILMIS, GPS sinyali var (uydular
# gorunuyor/takip ediliyor) ama osilator henuz kilitlenmemis --
# gercek Rubidium/CSAC osilatorlerin kararli calismaya baslamasi icin
# isinmasi gerekir.
#
# GERCEK CIHAZIN KILAVUZUNA GORE: bu isinma suresi "2 dakikadan az"
# ("less than 2 minutes warmup time to atomic lock"). "warmup: active: true"
# ile bu senaryo baslatilirsa, simulator KENDILIGINDEN, gercek sureye
# uygun sekilde 2 dakika sonra otomatik olarak kilitlenecek -- bunun
# icin ayrica bir komut gondermene GEREK YOK, sadece bekle.

device:
  serial_number: SIM000001
  firmware_version: "1.17"

gps:
  visible: 6
  tracking: 3

sync:
  locked: false
  holdover: false

warmup:
  active: true

diag:
  lifetime_hours: 0

measure:
  temperature: 25.0
  voltage: 1.66
  current: 0.42
  power_supply: 11.7