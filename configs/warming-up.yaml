# warming-up.yaml
#
# "Isiniyor" senaryosu: cihaz YENI ACILMIS. ONEMLI AYRIM: GPS sinyali
# GERCEKTEN IYI olmali (uydular takip ediliyor, fix var) -- cunku
# "isinma", GPS ALICISIYLA degil, ICERIDEKI OSILATORLE ilgili bir
# sey. GPS zaten fix bulmus olabilir, ama Rubidium/CSAC osilatoru
# kararli calismaya baslamak icin hala isinmaktadir.
#
# (Bu dosya daha once "tracking: 3" -- yani fix YOKMUS gibi -- ayarli
# idi, bu TUTARSIZDI: is_locked() artik "fix yoksa kilitlenemez"
# kuralini da uyguluyor, yani fix olmadan zaten hicbir zaman
# kilitlenemezdi, warmup sayaci hic islemezdi. Duzelttik.)
#
# GERCEK CIHAZIN KILAVUZUNA GORE: isinma suresi "2 dakikadan az"
# ("less than 2 minutes warmup time to atomic lock"). "warmup: active: true"
# ile bu senaryo baslatilirsa, simulator KENDILIGINDEN, gercek sureye
# uygun sekilde 2 dakika sonra otomatik olarak kilitlenecek -- bunun
# icin ayrica bir komut gondermene GEREK YOK, sadece bekle.

device:
  serial_number: "122301668"
  firmware_version: "1.17"

gps:
  visible: 12
  tracking: 8

sync:
  locked: false
  holdover: false

warmup:
  active: true

  # --- ISIL RAMPA (bkz. models/warmup.py) ---
  #     T(t) = T_son - (T_son - T_bas) * e^(-t/tau)
  #
  # ambient_temperature (T_bas): cihazin acilis anindaki sicakligi.
  #   VARSAYIM: kilavuz ortam sicakligi vermiyor, gercek cihaz
  #   kayitlari da acilis anini icermiyor. Ic mekan kullanimi icin
  #   makul bir deger (kilavuz §1.3.4 cihazin ic mekan icin
  #   tasarlandigini soyler).
  #
  # time_constant (tau): isil zaman sabiti, saniye. DUZELTILDI: cihazi
  #   calistiran kisinin gozlemine gore sicaklik HIZLI yukselir (birkac
  #   dakikada 40-50 C). Kilavuz §1.1 de dogruluyor: atomik kilit
  #   <2 dakika. 90 s ile 2 dk'da ~46 C, 5 dk'da ~52 C.
  #   (Eski 600 s degeri yanlisti; kilit suresini isiya baglamisti.)
  ambient_temperature: 25.0
  time_constant: 90.0

diag:
  lifetime_hours: 0

measure:
  # DIKKAT: bu deger artik "su an gosterilecek sicaklik" DEGIL,
  # isinma bitince ulasilacak KARARLI sicakliktir. Rampa
  # warmup.ambient_temperature'dan baslayip buraya yaklasir.
  # (Eskiden model statik oldugu icin burasi 25.0 idi -- yani cihaz
  # sonsuza kadar soguk kaliyordu.)
  temperature: 52.8
  voltage: 1.66
  current: 0.42
  power_supply: 11.7